name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish without a new commit.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        # The repository name is the Pages sub-path. Override BASE_PATH here if
        # you move the site to a custom domain or a user/org root site.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
